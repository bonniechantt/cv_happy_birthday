<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="candy" x1="440" y1="80" x2="650" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7FA"/>
      <stop offset="0.2" stop-color="#FFD7E7"/>
      <stop offset="0.56" stop-color="#F38DB3"/>
      <stop offset="1" stop-color="#D35B8B"/>
    </linearGradient>
    <linearGradient id="candySide" x1="600" y1="205" x2="600" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D96D97"/>
      <stop offset="1" stop-color="#A94773"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF8FB"/>
      <stop offset="0.3" stop-color="#F4A7C3"/>
      <stop offset="1" stop-color="#D25A88"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="165%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="14" result="offset"/>
      <feFlood flood-color="#823A5B" flood-opacity="0.28" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="organic" x="-5%" y="-8%" width="110%" height="125%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="18" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
    </filter>

    <!-- Each letter is placed independently to keep the hand-drawn, reference-like rhythm. -->
    <g id="topLetters" font-family="Arial Rounded MT Bold, Arial Rounded Bold, Cooper Black, Trebuchet MS, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke fill">
      <text x="150" y="330" font-size="216" transform="rotate(-8 150 330)">H</text>
      <text x="350" y="290" font-size="230" transform="rotate(3 350 290)">A</text>
      <text x="540" y="330" font-size="215" transform="rotate(2 540 330)">P</text>
      <text x="740" y="296" font-size="225" transform="rotate(-3 740 296)">P</text>
      <text x="956" y="335" font-size="218" transform="rotate(8 956 335)">Y</text>
    </g>
    <g id="bottomLetters" font-family="Arial Rounded MT Bold, Arial Rounded Bold, Cooper Black, Trebuchet MS, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke fill">
      <text x="185" y="535" font-size="140" transform="rotate(-4 185 535)">B</text>
      <text x="295" y="520" font-size="144" transform="rotate(3 295 520)">I</text>
      <text x="405" y="540" font-size="142" transform="rotate(-3 405 540)">R</text>
      <text x="525" y="523" font-size="141" transform="rotate(2 525 523)">T</text>
      <text x="650" y="536" font-size="139" transform="rotate(-2 650 536)">H</text>
      <text x="770" y="520" font-size="142" transform="rotate(3 770 520)">D</text>
      <text x="890" y="540" font-size="140" transform="rotate(-4 890 540)">A</text>
      <text x="1005" y="525" font-size="139" transform="rotate(5 1005 525)">Y</text>
    </g>
    <clipPath id="topClip"><use href="#topLetters"/></clipPath>
    <clipPath id="bottomClip"><use href="#bottomLetters"/></clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <g filter="url(#organic)">
      <use href="#topLetters" transform="translate(0 22)" fill="url(#candySide)" stroke="#A94773" stroke-width="21"/>
      <use href="#bottomLetters" transform="translate(0 19)" fill="url(#candySide)" stroke="#A94773" stroke-width="17"/>
      <use href="#topLetters" fill="url(#candy)" stroke="url(#edge)" stroke-width="13"/>
      <use href="#bottomLetters" fill="url(#candy)" stroke="url(#edge)" stroke-width="10"/>
    </g>

    <!-- Long, soft reflections echo the glossy candy highlights in the reference. -->
    <g clip-path="url(#topClip)" opacity="0.86" stroke="#FFF9FC" stroke-linecap="round" fill="none">
      <path d="M91 240C108 209 127 196 151 194" stroke-width="17"/>
      <path d="M296 176C313 151 335 139 359 139" stroke-width="16"/>
      <path d="M494 233C510 204 529 194 554 194" stroke-width="16"/>
      <path d="M692 190C711 163 731 154 755 154" stroke-width="16"/>
      <path d="M918 244C934 219 953 210 976 210" stroke-width="15"/>
    </g>
    <g clip-path="url(#bottomClip)" opacity="0.82" stroke="#FFF9FC" stroke-linecap="round" fill="none">
      <path d="M151 450C164 431 179 425 194 425" stroke-width="11"/>
      <path d="M278 440C287 427 297 423 307 423" stroke-width="11"/>
      <path d="M373 453C384 435 397 430 412 431" stroke-width="11"/>
      <path d="M493 441C505 425 517 421 531 422" stroke-width="11"/>
      <path d="M620 452C632 433 646 429 660 431" stroke-width="11"/>
      <path d="M742 439C754 424 768 420 781 422" stroke-width="11"/>
      <path d="M861 454C872 437 886 432 900 434" stroke-width="11"/>
      <path d="M982 442C994 427 1006 424 1018 426" stroke-width="11"/>
    </g>

    <g fill="#FFFFFF" opacity="0.76">
      <ellipse cx="119" cy="260" rx="8" ry="23" transform="rotate(-23 119 260)"/>
      <ellipse cx="350" cy="171" rx="8" ry="22" transform="rotate(18 350 171)"/>
      <ellipse cx="540" cy="252" rx="8" ry="21" transform="rotate(19 540 252)"/>
      <ellipse cx="741" cy="207" rx="8" ry="22" transform="rotate(20 741 207)"/>
      <ellipse cx="966" cy="266" rx="8" ry="21" transform="rotate(24 966 266)"/>
    </g>
    <g fill="#FFF7FA" opacity="0.9">
      <circle cx="217" cy="205" r="5"/>
      <circle cx="445" cy="182" r="4"/>
      <circle cx="620" cy="247" r="5"/>
      <circle cx="842" cy="196" r="4"/>
      <circle cx="240" cy="473" r="3.5"/>
      <circle cx="580" cy="463" r="3.5"/>
      <circle cx="927" cy="467" r="3.5"/>
    </g>
  </g>
</svg>
